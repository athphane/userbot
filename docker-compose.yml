services:
  userbot:
    build:
      context: .
      dockerfile: .build/dev.Dockerfile
    hostname: userbot
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./:/root/userbot
    networks:
      - userbot

networks:
  userbot:
    external: false
